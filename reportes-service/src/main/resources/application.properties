spring.application.name=reportes-service
spring.datasource.url=${REPORTES_DB_URL}
spring.datasource.username=${REPORTES_DB_USERNAME}
spring.datasource.password=${REPORTES_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true    
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8081

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000


OCI_USER_ID=${OCI_USER_ID}
OCI_TENANCY_ID=${OCI_TENANCY_ID}
OCI_FINGERPRINT=${OCI_FINGERPRINT}
OCI_REGION=${OCI_REGION}

OCI_NAMESPACE=${OCI_NAMESPACE}
OCI_BUCKET=${OCI_BUCKET}

OCI_PRIVATE_KEY_PATH=${OCI_PRIVATE_KEY_PATH}


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

rabbitmq.queue.reporte-nuevo=reporte.nuevo
rabbitmq.queue.reporte-estado-actualizar=reporte.estado.actualizar
rabbitmq.queue.reporte-cerrado=reporte.cerrado
rabbitmq.queue.reporte-proximo-vencer=reporte.proximo.vencer

spring.jackson.serialization.write-dates-as-timestamps=false

# Resilience4j
resilience4j.circuitbreaker.instances.geoService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.geoService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.geoService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.geoService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.geoService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.geoService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.retry.instances.geoService.maxAttempts=3
resilience4j.retry.instances.geoService.waitDuration=500ms
resilience4j.bulkhead.instances.geoService.maxConcurrentCalls=10
resilience4j.bulkhead.instances.geoService.maxWaitDuration=0

# Timeouts de Feign para geolocalizacion-service
spring.cloud.openfeign.client.config.geolocalizacion-service.connectTimeout=10000
spring.cloud.openfeign.client.config.geolocalizacion-service.readTimeout=20000

# Actuator para monitorear Resilience4j
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries
management.health.circuitbreakers.enabled=true