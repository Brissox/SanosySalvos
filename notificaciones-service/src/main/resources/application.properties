spring.application.name=notificaciones-service
server.port=8086

# PostgreSQL
spring.datasource.url=${NOTIFICACIONES_DB_URL}
spring.datasource.username=${NOTIFICACIONES_DB_USERNAME}
spring.datasource.password=${NOTIFICACIONES_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

rabbitmq.queue.notificacion-coincidencia=notificacion.coincidencia
rabbitmq.queue.reporte-proximo-vencer=reporte.proximo.vencer

# URLs de microservicios
services.reportes.url=http://localhost:8080

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

