resilience4j.circuitbreaker.instances.usuariosCircuitBreaker.slidingWindowSize=20
resilience4j.circuitbreaker.instances.usuariosCircuitBreaker.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.usuariosCircuitBreaker.failureRateThreshold=70
resilience4j.circuitbreaker.instances.usuariosCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.usuariosCircuitBreaker.permittedNumberOfCallsInHalfOpenState=5
resilience4j.timelimiter.instances.usuariosCircuitBreaker.timeoutDuration=10s

