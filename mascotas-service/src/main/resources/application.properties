spring.application.name=mascotas-service
spring.datasource.url=${MASCOTAS_DB_URL}
spring.datasource.username=${MASCOTAS_DB_USERNAME}
spring.datasource.password=${MASCOTAS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true    
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

OCI_USER_ID=${OCI_USER_ID}
OCI_TENANCY_ID=${OCI_TENANCY_ID}
OCI_FINGERPRINT=${OCI_FINGERPRINT}
OCI_REGION=${OCI_REGION}

OCI_NAMESPACE=${OCI_NAMESPACE}
OCI_BUCKET=${OCI_BUCKET}

OCI_PRIVATE_KEY_PATH=${OCI_PRIVATE_KEY_PATH}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=8083
